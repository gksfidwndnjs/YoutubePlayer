<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style.css">
  <style>
    html, body { background: transparent; margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #popup-frame {
      height: 100%; display: flex; flex-direction: column;
      background-color: var(--bg);
      background-image: var(--metal-shine);
      border-radius: 18px; overflow: hidden;
      border: 1px solid transparent; background-clip: padding-box;
      padding: 10px;
    }
    #playlist-crt {
      flex: 1; overflow: hidden; display: flex; flex-direction: column;
      position: relative;
      background: linear-gradient(180deg, #0c120e 0%, #0f1a10 100%);
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.55);
      border-top-color: rgba(0,255,80,0.12);
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.7), inset -1px -1px 2px rgba(0,255,80,0.04), 0 0 8px rgba(0,232,87,0.08);
      animation: crt-flicker 9s infinite, crt-glow 13s infinite;
    }
    #playlist-crt::before {
      content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit;
      background: repeating-linear-gradient(0deg, rgba(0,255,80,0.03) 0px, rgba(0,255,80,0.03) 1px, rgba(0,0,0,0.28) 1px, rgba(0,0,0,0.28) 2px, transparent 2px, transparent 4px);
    }
    #playlist-crt::after {
      content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: inherit;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
    }
    #playlist-list { display: flex; flex-direction: column; overflow-y: auto; flex: 1; position: relative; z-index: 1; }
    .pl-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; font-size: 11px; cursor: pointer;
      color: rgba(0,232,87,0.55); gap: 8px; user-select: none;
      border-bottom: 1px solid rgba(0,232,87,0.06);
    }
    .pl-item:hover { background: rgba(0,232,87,0.05); color: rgba(0,232,87,0.85); }
    .pl-item.active { color: #00e857; text-shadow: 0 0 8px rgba(0,232,87,0.8), 0 0 20px rgba(0,232,87,0.3); }
    .pl-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pl-item-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .pl-divider { border-top: 1px solid rgba(0,232,87,0.10); margin: 2px 0; }
    .count-badge {
      background: rgba(0,232,87,0.12); color: rgba(0,232,87,0.65);
      border: 1px solid rgba(0,232,87,0.2); border-radius: 3px;
      font-size: 9px; padding: 1px 5px;
    }
    .delete-pl-btn {
      color: rgba(0,232,87,0.45) !important;
      font-size: 15px; line-height: 1; padding: 2px 5px !important;
    }
    .delete-pl-btn:hover { color: #00e857 !important; }
  </style>
</head>
<body>
<div id="popup-frame">
  <div id="playlist-crt">
    <div id="playlist-list"></div>
  </div>
</div>
<script src="playlist.js"></script>
</body>
</html>
