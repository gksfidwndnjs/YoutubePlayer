<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style.css">
  <style>
    html, body { background: transparent; margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #popup-frame {
      height: 100%; display: flex; flex-direction: column;
      background-color: var(--bg);
      background-image: var(--metal-shine);
      border-radius: var(--window-radius); overflow: hidden;
      border: 1px solid transparent; background-clip: padding-box;
      padding: 10px;
    }
    #playlist-crt {
      flex: 1; overflow: hidden; display: flex; flex-direction: column;
      position: relative;
      background: var(--crt-bg-gradient);
      border-radius: 8px;
      border: var(--crt-border);
      border-top-color: var(--crt-border-top);
      box-shadow: var(--crt-shadow);
      animation: crt-flicker var(--crt-flicker-duration) infinite, crt-glow var(--crt-glow-duration) infinite;
    }
    #playlist-crt::before {
      content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit;
      background: var(--crt-scanline);
    }
    #playlist-crt::after {
      content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: inherit;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
    }
    #playlist-list { display: flex; flex-direction: column; overflow-y: auto; flex: 1; position: relative; z-index: 1; }
    .pl-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; font-size: 11px; cursor: pointer;
      color: rgba(0,232,87,0.55); gap: 8px; user-select: none;
      border-bottom: 1px solid rgba(0,232,87,0.06);
    }
    .pl-item:hover { background: rgba(0,232,87,0.05); color: rgba(0,232,87,0.85); }
    .pl-item.active { color: #00e857; text-shadow: 0 0 8px rgba(0,232,87,0.8), 0 0 20px rgba(0,232,87,0.3); }
    .pl-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pl-item-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .pl-divider { border-top: 1px solid rgba(0,232,87,0.10); margin: 2px 0; }
    .pl-category {
      padding: 8px 12px 3px; font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.6px;
      color: rgba(0,232,87,0.42); user-select: none;
      border-top: 1px solid rgba(0,232,87,0.10);
    }
    .count-badge {
      background: rgba(0,232,87,0.12); color: rgba(0,232,87,0.65);
      border: 1px solid rgba(0,232,87,0.2); border-radius: 3px;
      font-size: 9px; padding: 1px 5px;
    }
    .pl-refresh-row { padding: 7px 10px 6px; border-bottom: 1px solid rgba(0,232,87,0.10); }
    .pl-refresh-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 6px 8px; font-size: 10px; cursor: pointer;
      background: rgba(0,232,87,0.08); color: rgba(0,232,87,0.85);
      border: 1px solid rgba(0,232,87,0.25); border-radius: 4px;
    }
    .pl-refresh-btn:hover:not(:disabled) { background: rgba(0,232,87,0.16); color: #00e857; }
    .pl-refresh-btn:disabled { opacity: 0.4; cursor: default; }
    .pl-nolink { color: rgba(255,196,0,0.75); font-size: 10px; cursor: help; }
    .delete-pl-btn {
      color: rgba(0,232,87,0.45) !important;
      font-size: 15px; line-height: 1; padding: 2px 5px !important;
    }
    .delete-pl-btn:hover { color: #00e857 !important; }
  </style>
</head>
<body>
<div id="popup-frame">
  <div id="playlist-crt">
    <div id="playlist-list"></div>
  </div>
</div>
<script src="playlist.js"></script>
</body>
</html>
