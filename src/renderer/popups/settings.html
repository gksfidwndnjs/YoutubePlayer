<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style.css">
  <style>
    html, body { background: transparent; margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #popup-frame {
      height: 100%; display: flex; flex-direction: column;
      background-color: var(--bg);
      background-image: var(--metal-shine);
      border-radius: var(--window-radius); overflow: hidden;
      border: 1px solid transparent; background-clip: padding-box;
    }
    .popup-section-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px; flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.10);
      border-bottom: 1px solid rgba(0,0,0,0.35);
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text); text-shadow: 0 1px 3px rgba(0,0,0,0.95);
    }
    .popup-section-body { padding: 12px 14px; flex: 1; overflow-y: auto; }
    .popup-footer {
      display: flex; gap: 8px; justify-content: flex-end;
      padding: 10px 14px; flex-shrink: 0;
      border-top: 1px solid rgba(0,0,0,0.35);
    }
    input[type="text"], input[type="password"] {
      background-image:
        repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0,0,0,0.13) 3px, rgba(0,0,0,0.13) 4px),
        var(--crt-bg-gradient);
      background-color: #0c120e;
      color: var(--crt-green);
      text-shadow: 0 0 6px rgba(0,232,87,0.7);
      border: var(--crt-border);
      border-top-color: var(--crt-border-top);
      box-shadow: var(--crt-shadow);
      caret-color: var(--crt-green);
    }
    input[type="text"]::placeholder, input[type="password"]::placeholder { color: rgba(0,232,87,0.3); text-shadow: none; }
    input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: rgba(0,232,87,0.3); }
    .settings-section-title { color: var(--text); text-shadow: 0 1px 2px rgba(0,0,0,0.8); margin-bottom: 10px; }
    .settings-label { color: var(--text) !important; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .settings-hint { color: var(--text-muted); text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
    .radio-option span, .checkbox-option span { text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .hint-inline { text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .settings-row + .settings-row { margin-top: 14px; }
  </style>
</head>
<body>
<div id="popup-frame">
  <div class="popup-section-hdr">
    Settings
    <button id="close-btn" class="btn-icon btn-3d">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="popup-section-body">
    <div class="settings-section">
      <div class="settings-section-title">YouTube API</div>
      <div class="settings-row">
        <div class="settings-label">API Key</div>
        <div class="settings-hint">Required for search. Get one free from <strong>Google Cloud Console</strong> → APIs &amp; Services → YouTube Data API v3.</div>
        <div class="settings-field-row" style="margin-top:8px">
          <input id="settings-api-key" type="password" placeholder="AIza…" spellcheck="false" autocomplete="off">
          <button id="settings-key-toggle" class="btn-3d">Show</button>
        </div>
      </div>
    </div>

    <div class="settings-section" style="margin-top:16px">
      <div class="settings-section-title">Playback</div>
      <div class="settings-row">
        <div class="settings-label">Audio Quality</div>
        <div class="settings-radio-group" style="margin-top:6px">
          <label class="radio-option">
            <input type="radio" name="audio-quality" value="best">
            <span>Best available</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="audio-quality" value="standard">
            <span>Standard <span class="hint-inline">(≤ 128 kbps, faster load)</span></span>
          </label>
        </div>
      </div>
      <div class="settings-row">
        <label class="checkbox-option">
          <input type="checkbox" id="settings-autoadvance">
          <span>Auto-advance queue</span>
        </label>
      </div>
    </div>

    <div class="settings-section" style="margin-top:16px">
      <div class="settings-section-title">Downloads</div>
      <div class="settings-row">
        <div class="settings-label">Music download folder</div>
        <div class="settings-hint">Tracks are saved here as m4a + thumbnail. Downloaded tracks play from disk instead of streaming.</div>
        <div class="settings-field-row" style="margin-top:8px">
          <input id="settings-music-dir" type="text" readonly spellcheck="false" placeholder="(default Music folder)">
          <button id="settings-browse-dir" class="btn-3d">Browse…</button>
        </div>
      </div>
    </div>
  </div>

  <div class="popup-footer">
    <button id="cancel-btn" class="btn-3d">Cancel</button>
    <button id="save-btn" class="btn-3d">Save</button>
  </div>
</div>
<script src="settings.js"></script>
</body>
</html>
