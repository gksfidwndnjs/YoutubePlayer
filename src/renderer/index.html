<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metalwave for YouTube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="youtube-player"></audio>

<div id="app">

  <div id="content">

    <main id="main">
      <div id="player-area">

        <!-- Playlist panel -->
        <div id="playlist-panel">
          <div id="playlist-panel-header">
            <div class="playlist-selector" id="playlist-selector">
              <button id="playlist-dropdown-btn" class="playlist-crt-btn">
                <div id="playlist-display-title">Queue</div>
                <div id="playlist-display-meta">(0/0)</div>
              </button>
              <div id="playlist-dropdown-menu" class="dropdown-menu hidden">
                <div class="dropdown-item active" id="dropdown-queue-item">Queue</div>
                <div id="playlist-items-container"></div>
                <div class="dropdown-divider"></div>
                <button id="open-add-playlist-btn" class="dropdown-new-btn">+ Add Playlist</button>
              </div>
            </div>
            <span id="key-indicator" class="key-dot no-key" title="API Key status"></span>
            <button id="playlist-panel-toggle" class="btn-icon btn-3d panel-toggle-btn" title="Toggle playlist">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"/>
              </svg>
            </button>
          </div>
          <div id="queue-list">
            <div class="empty-state">Your queue is empty</div>
          </div>
        </div>

        <!-- Auto-update download progress — shown only while downloading -->
        <div id="update-progress" class="hidden">
          <div id="update-progress-head">
            <span id="update-progress-label">업데이트 다운로드 중…</span>
            <span id="update-progress-meta"></span>
          </div>
          <div id="update-progress-track"><div id="update-progress-fill"></div></div>
        </div>

        <!-- Player bar — always visible -->
        <div id="player-bar">
          <div id="player-bar-main">

            <div id="disc-frame">
              <div id="player-disc">
                <div id="album-placeholder">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="#555" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="3" fill="#555"/>
                  </svg>
                </div>
                <img id="album-art" src="" alt="">
              </div>
            </div>

            <div id="player-right">
              <div id="player-actions">
                <button id="pin-btn" class="btn-icon btn-3d" title="Always on top">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5v6h2v-6h5v-2l-2-2z"/></svg>
                </button>
                <button id="position-btn" class="btn-icon btn-3d" title="위치 / 모니터">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                  </svg>
                </button>
                <button id="add-search-toggle" class="btn-icon btn-3d" title="Add / Search">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
                <button id="settings-btn" class="btn-icon btn-3d" title="Settings">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                  </svg>
                </button>
                <div class="actions-sep"></div>
                <button id="minimize-btn" class="btn-icon btn-3d wm-btn" title="Minimize">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button id="close-btn" class="btn-icon btn-3d wm-btn wm-close" title="Close">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </div>

              <div id="player-info">
                <div id="info-view">
                  <div id="video-title">NULL</div>
                  <div id="video-channel">NULL</div>
                </div>
                <div id="lyrics-view" class="hidden">
                  <div id="lyrics-scroll"></div>
                </div>
                <button id="lyrics-toggle-btn" title="가사 / 곡 정보 전환">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
                </button>
              </div>

              <div id="player-controls">
                <button id="prev-btn" class="ctrl-btn btn-3d" title="Previous (←)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17 18L7 12 17 6v12zm-11 0V6"/></svg>
                </button>
                <button id="playpause-btn" class="ctrl-btn ctrl-btn-main btn-3d" title="Play (Space)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
                </button>
                <button id="next-btn" class="ctrl-btn btn-3d" title="Next (→)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M7 18l10-6L7 6v12zm11 0V6"/></svg>
                </button>
                <button id="repeat-btn" class="ctrl-btn btn-3d" title="한 번만 재생"></button>
              </div>
            </div>

          </div>
          <div id="player-bar-bottom">
            <div id="time-display">
              <span id="time-current">0:00</span>
              <span class="time-sep"> / </span>
              <span id="time-duration">0:00</span>
            </div>
            <div class="crt-range-wrap" id="progress-wrap"><input id="progress-bar" type="range" min="0" max="100" value="0" step="0.1"></div>
            <button id="mute-btn" class="btn-icon btn-3d" title="Mute">
              <svg id="volume-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="crt-range-wrap" id="volume-wrap" style="width:70px;flex:none"><input id="volume-bar" type="range" min="0" max="1" value="1" step="0.01"></div>
          </div>
        </div>

      </div>
    </main>

  </div>

  <!-- Window placement popover (corner snap + monitor switch) -->
  <div id="position-popover" class="hidden">
    <button id="pos-monitor-btn" class="btn-icon btn-3d" title="다른 모니터로">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="13" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </button>
    <div class="actions-sep"></div>
    <div class="pos-corner-grid">
      <button class="pos-corner btn-icon btn-3d" data-corner="tl" title="좌상단">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="12" height="12" rx="1.5"/><rect x="3.4" y="3.4" width="4.4" height="4.4" rx="0.8" fill="#00e857" stroke="none"/></svg>
      </button>
      <button class="pos-corner btn-icon btn-3d" data-corner="tr" title="우상단">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="12" height="12" rx="1.5"/><rect x="8.2" y="3.4" width="4.4" height="4.4" rx="0.8" fill="#00e857" stroke="none"/></svg>
      </button>
      <button class="pos-corner btn-icon btn-3d" data-corner="bl" title="좌하단">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="12" height="12" rx="1.5"/><rect x="3.4" y="8.2" width="4.4" height="4.4" rx="0.8" fill="#00e857" stroke="none"/></svg>
      </button>
      <button class="pos-corner btn-icon btn-3d" data-corner="br" title="우하단">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="12" height="12" rx="1.5"/><rect x="8.2" y="8.2" width="4.4" height="4.4" rx="0.8" fill="#00e857" stroke="none"/></svg>
      </button>
    </div>
  </div>

</div>

<!-- Add Playlist Modal -->
<div id="add-playlist-modal" class="modal hidden">
  <div class="modal-backdrop" id="add-playlist-backdrop"></div>
  <div class="modal-box">
    <h2>Add Playlist</h2>
    <div class="settings-row">
      <div class="settings-label">YouTube Playlist URL</div>
      <div class="settings-field-row" style="margin-top:8px">
        <input id="add-playlist-url" type="text" placeholder="https://youtube.com/playlist?list=…">
        <button id="add-playlist-fetch-btn" class="btn-secondary">Fetch</button>
      </div>
    </div>
    <div id="add-playlist-preview" class="hidden">
      <div class="settings-row" style="margin-top:14px">
        <div class="settings-label">Name</div>
        <input id="add-playlist-name" type="text" placeholder="Playlist name" style="margin-top:8px">
      </div>
      <div class="settings-hint" id="add-playlist-info" style="margin-top:6px"></div>
    </div>
    <div class="modal-actions" style="margin-top:20px">
      <button id="add-playlist-save-btn" disabled>Save</button>
      <button id="add-playlist-cancel-btn" class="btn-secondary">Cancel</button>
    </div>
  </div>
</div>

<!-- First-run setup -->
<div id="setup-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-box setup-box">
    <h2>초기 설정</h2>
    <p>다운로드한 곡을 저장할 폴더를 선택하세요. 비워두면 기본 음악 폴더를 사용합니다. 나중에 설정에서 바꿀 수 있습니다.</p>
    <div class="settings-label">음악 저장 폴더</div>
    <div class="settings-field-row" style="margin-top:8px">
      <input id="setup-music-dir" type="text" readonly spellcheck="false" placeholder="(기본 음악 폴더)">
      <button id="setup-browse-btn" class="btn-3d">찾기…</button>
    </div>
    <div class="modal-actions" style="margin-top:20px; justify-content:flex-end">
      <button id="setup-start-btn" class="btn-3d">시작하기</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
